[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-adr-feed"
version = "0.1.0"
description = "YouTube transcript monitor → Qdrant + GitHub ADR pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ryan Dahlberg", email = "ryan.dahlberg@gmail.com"},
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "yt-dlp>=2024.0",
    "youtube-transcript-api>=0.6",
    "sentence-transformers>=2.2",
    "qdrant-client>=1.7",
    "scikit-learn>=1.3",
    "python-json-logger>=2.0",
    "tenacity>=8.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "ruff>=0.1",
]

[project.scripts]
yt-adr-feed = "yt_adr_feed.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

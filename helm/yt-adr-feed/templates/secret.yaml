{{- if or .Values.secrets.githubToken .Values.secrets.sshPrivateKey .Values.secrets.qdrantApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yt-adr-feed.fullname" . }}-secrets
  labels:
    {{- include "yt-adr-feed.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.githubToken }}
  github-token: {{ .Values.secrets.githubToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.qdrantApiKey }}
  qdrant-api-key: {{ .Values.secrets.qdrantApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sshPrivateKey }}
  ssh-private-key: {{ .Values.secrets.sshPrivateKey | b64enc | quote }}
  {{- end }}
{{- end }}
